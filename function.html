<!DOCTYPE html>
<html>
    <head>
        <title>
            Functions in JavaScript
        </title>
    </head>
    <body>
        <button onclick="multiply(18,4)">
            Click me to multiply!
        </button>
        <script>
            function multiply(x,y) {
                document.write(x*y);
            }
        </script>
    </body>
</html>
