<!DOCTYPE html>
<html>
    <head>
        <title>
            score of variables
        </title>
    </head>
    <body>
        <p>
            A function can access the variable defined inside the function
        </p>
        <button onclick="my_function()">
            click me!
        </button>
        <p id="demo1"></p>
        <p id="demo2"></p>


        <script>
            var a=10;
            function my_function(){
                var b=20;
                document.getElementById("demo1").innerHTML=a*b;
            }
             document.getElementById("demo2").innerHTML=b;
        </script>
    </body>
</html>
